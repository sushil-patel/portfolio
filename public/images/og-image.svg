<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle Grid Accent -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="#334155" stroke-width="2"/>

  <!-- Brand Mark Icon -->
  <rect x="80" y="80" width="64" height="64" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="112" y="122" font-family="monospace" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">SP</text>

  <!-- Tag Pill -->
  <rect x="160" y="92" width="280" height="38" rx="19" fill="#064e3b" stroke="#059669" stroke-width="1"/>
  <circle cx="180" cy="111" r="5" fill="#34d399"/>
  <text x="195" y="116" font-family="sans-serif" font-size="14" font-weight="600" fill="#a7f3d0">AVAILABLE FOR BACKEND ROLES</text>

  <!-- Main Name & Title -->
  <text x="80" y="215" font-family="sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
    Sushil Patel
  </text>
  <text x="80" y="265" font-family="sans-serif" font-size="28" font-weight="600" fill="#10b981">
    Java Backend Developer · Module Lead
  </text>

  <!-- Summary Description -->
  <text x="80" y="325" font-family="sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Building high-throughput APIs, event-driven pipelines, and distributed microservices.
  </text>
  <text x="80" y="355" font-family="sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    3 years enterprise experience at Tata Consultancy Services (TCS) · AWS Certified Developer.
  </text>

  <!-- Key Metrics Row -->
  <rect x="80" y="405" width="220" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="105" y="445" font-family="monospace" font-size="28" font-weight="800" fill="#34d399">240x Faster</text>
  <text x="105" y="475" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Deployment Validation</text>

  <rect x="320" y="405" width="220" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="345" y="445" font-family="monospace" font-size="28" font-weight="800" fill="#34d399">800K+ / 20m</text>
  <text x="345" y="475" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Batch Ingestion Window</text>

  <rect x="560" y="405" width="220" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="585" y="445" font-family="monospace" font-size="28" font-weight="800" fill="#34d399">~30% Drop</text>
  <text x="585" y="475" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8">ORM &amp; Query Latency</text>

  <rect x="800" y="405" width="220" height="90" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="825" y="445" font-family="monospace" font-size="28" font-weight="800" fill="#34d399">Module Lead</text>
  <text x="825" y="475" font-family="sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Leading 4 Engineers (TCS)</text>

  <!-- Bottom URL Bar -->
  <line x1="80" y1="535" x2="1120" y2="535" stroke="#334155" stroke-width="1"/>
  <text x="80" y="568" font-family="monospace" font-size="15" font-weight="500" fill="#64748b">
    sushil-patel.github.io · mrsushilpatel2001@gmail.com
  </text>
  <text x="1120" y="568" font-family="monospace" font-size="15" font-weight="500" fill="#10b981" text-anchor="end">
